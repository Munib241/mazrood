<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      try {
        var t = localStorage.getItem("mazrood-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }
        if (t === "light") {
          document.documentElement.classList.add("light-mode");
        }
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Mazrood Studio — new-season streetwear, knits and headwear. Shop SS26 caps, hoodies and end-of-season markdowns." />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Archivo:wdth,wght@125,900&display=swap" rel="stylesheet" />
    <title>Mazrood Studio — SS26 Streetwear | End of Season</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
